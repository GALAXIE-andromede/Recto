<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A5C78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recto">
<title>Recto – Plateforme d'Excellence Exétat RDC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F2;--surface:#FFFFFF;--surface2:#F4F7F6;--ink:#0E2A38;--muted:#4F656E;--line:#D3DEDC;
  --brand:#0A5C78;--on-brand:#FFFFFF;--brand-soft:#DCEEF4;--sel:#DCEEF4;
  --good:#1B7A53;--good-bg:#DDF1E7;--bad:#B3322F;--bad-bg:#FBE4E1;
  --t1:#0A5C78;--t2:#1F7A57;--t3:#9A6414;--t4:#A8472F;
  --hero1:#0A5C78;--hero2:#0C3A50;
  --shadow:0 1px 2px rgba(14,42,56,.06),0 8px 22px rgba(14,42,56,.08);
  --font-d:'Fraunces',Georgia,serif;--font-b:'Source Sans 3',system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08161D;--surface:#0F2530;--surface2:#12303D;--ink:#E6F1F2;--muted:#9DB3BB;--line:#1E3B48;
    --brand:#62BBD8;--on-brand:#04212C;--brand-soft:#123A4A;--sel:#123A4A;
    --good:#5FD3A0;--good-bg:#11382B;--bad:#FF908A;--bad-bg:#3F1B1A;
    --t1:#62BBD8;--t2:#5FD3A0;--t3:#E7B04F;--t4:#F0916F;
    --hero1:#12485E;--hero2:#0A2B3A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#08161D;--surface:#0F2530;--surface2:#12303D;--ink:#E6F1F2;--muted:#9DB3BB;--line:#1E3B48;
  --brand:#62BBD8;--on-brand:#04212C;--brand-soft:#123A4A;--sel:#123A4A;
  --good:#5FD3A0;--good-bg:#11382B;--bad:#FF908A;--bad-bg:#3F1B1A;
  --t1:#62BBD8;--t2:#5FD3A0;--t3:#E7B04F;--t4:#F0916F;
  --hero1:#12485E;--hero2:#0A2B3A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:var(--fs,17px);line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 18px 36px}.wrap.hasbar{padding-bottom:112px}
h1,h2,h3{font-family:var(--font-d);margin:0;line-height:1.15;letter-spacing:-.005em}
h1{font-size:28px;font-weight:700}h2{font-size:24px;font-weight:700}h3{font-size:18px;font-weight:700}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px}
.ico{display:block;flex:none}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:2px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:700;text-decoration:none;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand)}.btn.small{min-height:44px;padding:0 14px;font-size:14.5px}.btn.full{display:flex;width:100%}
.btn.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}.btn.light{background:#fff;border-color:#fff;color:#0A4A62}
.link{background:none;border:0;padding:8px 0;min-height:44px;color:var(--brand);font-weight:700;text-align:left}.link.danger{color:var(--bad)}
.chip{border:1.5px solid var(--t3);background:transparent;color:var(--ink);border-radius:999px;min-height:40px;padding:0 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.mini{min-height:34px;padding:0 10px;font-size:13px}
.chip.selecteur{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);max-width:100%;overflow:hidden}
.chip.selecteur .chip-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.iconbtn{flex:none;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center}

/* Barres d'en-tête */
.appbar{display:flex;align-items:center;gap:8px;padding:12px 0 6px;flex-wrap:wrap}
.burger{flex:none;width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;font-size:18px}
.ab-t{flex:1 1 120px;min-width:0;overflow:hidden}.ab-n{font-family:var(--font-d);font-weight:700;font-size:21px;line-height:1.1}.ab-s{font-size:13px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%}
.appbar-actions{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto}
.subbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sb-t{flex:1;min-width:0;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pagehead{padding:18px 0 4px}
.offline-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--bad-bg);color:var(--bad)}

/* Cadre Hero & Anneau */
.hero{position:relative;overflow:hidden;margin-top:8px;padding:20px;border-radius:24px;color:#fff;background:linear-gradient(140deg,var(--hero1),var(--hero2));box-shadow:var(--shadow)}
.hero .topo{position:absolute;right:-40px;top:-30px;width:300px;opacity:.16;pointer-events:none;color:#fff}
.hero-in{position:relative;display:flex;gap:14px;align-items:center;justify-content:space-between}
.eyebrow{font-size:13px;font-weight:600;opacity:.85}.hero h2{font-size:26px;color:#fff;margin-top:4px}.hero p{margin:6px 0 0;font-size:15px;opacity:.92}.hero .btn{position:relative;margin-top:14px}
.ringbox{position:relative;flex:none}.ringbox .lab{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:19px}
.rg-bg{stroke:rgba(255,255,255,.28)}.rg-fg{stroke:#fff;transition:stroke-dashoffset .4s}
.ring-dark .rg-bg{stroke:var(--line)}.ring-dark .rg-fg{stroke:var(--brand)}

/* Barre rapide Recherche + Chat IA + Objectif & Modes */
.streak-bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.streak-pill{flex:1;min-width:96px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:var(--shadow)}
.streak-pill b{font-family:var(--font-d);font-size:16px;line-height:1.15;color:var(--brand)}
.streak-pill span{font-size:11.5px;color:var(--muted);margin-top:2px}
.quick-modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media (max-width:440px){.quick-modes{grid-template-columns:1fr}}
.qmode-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.qmode-btn span.qm-sub{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.qmode-btn .qm-badge{flex:none;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.qmode-btn.warn .qm-badge{background:var(--bad-bg);color:var(--bad)}
.course-tools{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.course-tools input{flex:1;min-width:170px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px;font-size:15px}
.ia-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--brand-soft);border:1.5px solid var(--brand)}
.ia-strip-t{font-size:14px;line-height:1.3}.ia-strip-t b{display:block;color:var(--brand);font-size:14.5px}

/* Rendu scientifique des formules */
.sci sub,.sci sup{font-size:.73em;line-height:0;font-weight:700}
.sci sub{vertical-align:sub}.sci sup{vertical-align:super}

/* Listes de cours & Leçons */
.part{display:flex;align-items:center;gap:10px;margin:26px 0 0;font-size:20px}
.part::before{content:"";flex:none;width:6px;height:24px;border-radius:3px;background:var(--c,var(--brand))}
.chap{margin:16px 2px 0;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.chap h3{flex:1;font-family:var(--font-b);font-size:15px;font-weight:700;color:var(--muted)}
.list{list-style:none;margin:8px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.lrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}.lrow:last-child{border-bottom:0}
.lmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 6px 12px 14px;background:none;border:0;text-align:left;min-height:66px}
.lbadge{flex:none;min-width:42px;height:42px;padding:0 6px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:14px;color:var(--c,var(--brand));border:2px solid var(--c,var(--brand))}
.ltxt{flex:1;min-width:0}.deck-name{display:block;font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}.deck-meta{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.mini{display:block;height:4px;border-radius:4px;background:var(--line);margin-top:7px;overflow:hidden}.mini i{display:block;height:100%;background:var(--c,var(--brand));width:var(--p,0%)}
.go{flex:none;align-self:center;margin:0 12px 0 4px;width:44px;height:44px;border-radius:50%;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.go.lockd{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.foot{margin-top:28px;color:var(--muted);font-size:13.5px}
.bonus-banner{margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--brand-soft);border:1px dashed var(--brand);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px}

/* Barre d'onglets inférieure */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(14,42,56,.06)}
.tabs{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;min-height:60px}
.tico{display:grid;place-items:center;width:54px;height:30px;border-radius:15px}
.tab.on{color:var(--brand)}.tab.on .tico{background:var(--brand-soft)}

/* Cartes 3D, Quiz & Examen */
.scene{margin-top:18px;perspective:1200px}
.flip{position:relative;display:block;width:100%;min-height:340px;padding:0;border:0;background:none;transform-style:preserve-3d;transition:transform .55s;text-align:center}
.flip.is-flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:26px 22px;border-radius:24px;backface-visibility:hidden;overflow:auto}
.front{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}.back{background:var(--brand);color:var(--on-brand);transform:rotateY(180deg)}
.hint{text-align:center;color:var(--muted);font-size:15px;margin:12px 0 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.answers[hidden]{display:none}
.result{text-align:center;margin-top:28px}.result .big{font-family:var(--font-d);font-size:52px;font-weight:700;line-height:1;margin:12px 0 6px}
.qcard{margin-top:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;padding:18px 20px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.qtools{display:flex;align-items:center;gap:6px}
.qtool{min-width:38px;height:38px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.qtool.fav{border-color:var(--t3);color:var(--t3);background:var(--brand-soft)}
.qtxt{font-family:var(--font-d);font-weight:500;font-size:clamp(19px,4.5vw,25px);line-height:1.28;margin:6px 0 0}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:56px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left}
.opt.sel{border-color:var(--brand);background:var(--sel)}.opt.good{border-color:var(--good);background:var(--good-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center}
.opt.sel .box,.opt.good .box{background:var(--brand);border-color:var(--brand)}
.opt.sel .box::after,.opt.good .box::after{content:"✓";color:#fff;font-size:15px;font-weight:700}
.opt.bad .box::after{content:"✕";color:var(--bad);font-size:14px;font-weight:700}
.fb{margin-top:16px;padding:12px 14px;border-radius:14px;font-weight:700}.fb.good{background:var(--good-bg);color:var(--good)}.fb.bad{background:var(--bad-bg);color:var(--bad)}
.learn{margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.timer-pill{flex:none;padding:5px 11px;border-radius:999px;font-family:monospace;font-size:14px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.timer-pill.low{background:var(--bad-bg);color:var(--bad)}
.exam-recap{text-align:left;margin-top:20px;display:flex;flex-direction:column;gap:10px}
.exam-item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.exam-item.bad{border-left:4px solid var(--bad)}.exam-item.good{border-left:4px solid var(--good)}
.synth-sheet{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.synth-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}

/* Formulaires & Cartes personnelles */
label{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],textarea{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px;align-items:center}.row input{flex:1}
.cards{list-style:none;margin:14px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.cards li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.cards li:last-child{border-bottom:0}
.cards .q{font-weight:700}.cards .a{color:var(--muted);margin-top:2px}.cards .ok{color:var(--good);font-weight:700;font-size:13px}

/* Progrès et Réglages */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:16px 0 4px}
.bar>i{display:block;height:100%;background:var(--good);width:var(--p,0%)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--font-d);font-size:24px;line-height:1.1}.stat span{font-size:12px;color:var(--muted)}
.center{display:flex;justify-content:center;margin-top:18px}
.prow-btn{display:block;width:100%;padding:14px 16px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--ink)}
.list li:last-child .prow-btn{border-bottom:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ph b{font-size:15.5px;line-height:1.3}
.ph .ppct{font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--brand);white-space:nowrap}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.pbar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--brand));width:var(--p,0%);transition:width .35s ease}
.pmeta{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.shead{font-size:13px;font-weight:700;color:var(--muted);margin:24px 4px 0}
.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-top:8px}
.srow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);min-height:58px;flex-wrap:wrap}
.srow:last-child{border-bottom:0}.st{flex:1;min-width:140px}.st b{display:block}.st span{font-size:13.5px;color:var(--muted);display:block}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 11px;border-radius:9px;font-weight:600;color:var(--muted);min-height:38px;font-size:14px}
.seg button.on{background:var(--brand);color:var(--on-brand)}

/* Tiroir de menu latéral (Drawer) */
.drawer-backdrop{position:fixed;inset:0;z-index:30;background:rgba(6,20,28,.65);opacity:0;pointer-events:none;transition:opacity .3s}
.drawer-backdrop.ouvert{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:88%;max-width:400px;z-index:35;background:var(--surface);box-shadow:4px 0 24px rgba(0,0,0,.3);transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,0,0,1);overflow-y:auto;padding:20px 18px}
.drawer.ouvert{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
.acc-section{margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface2)}
.acc-btn{width:100%;min-height:52px;padding:11px 14px;background:none;border:0;font-weight:700;font-size:14.5px;text-align:left;display:flex;flex-direction:column;align-items:stretch;gap:7px;color:var(--ink)}
.acc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.acc-meta{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.sec-pbar{display:block;width:100%;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.sec-pbar>i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.acc-content{display:none;padding:6px 10px 12px;background:var(--surface)}
.acc-section.on .acc-content{display:block}
.cours-item{padding:8px 10px;border-radius:10px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;min-height:46px}
.cours-item.actif{background:var(--brand-soft);color:var(--brand)}
.cours-info{flex:1;min-width:0}
.cours-sub{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px}
.sec-ia-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}

/* Landing Page */
.landing{padding:14px 0 30px}
.landing-hero{background:linear-gradient(145deg,var(--hero1),var(--hero2));border-radius:28px;padding:28px 22px;color:#fff;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.landing-badge{display:inline-block;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.2);font-size:13px;font-weight:700;margin-bottom:12px}
.landing-hero h1{font-size:30px;line-height:1.15;color:#fff}
.landing-hero p{font-size:16px;opacity:.92;margin:12px auto 20px;max-width:460px}
.grid-atouts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
@media (max-width:460px){.grid-atouts{grid-template-columns:1fr}}
.card-atout{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card-atout b{display:block;font-size:15px;color:var(--ink);margin-top:6px}
.card-atout span{font-size:13px;color:var(--muted)}

/* Modales & Chat IA */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(6,20,28,.58);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;background:var(--surface);border-radius:26px 26px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.id-appareil-box{background:var(--surface2);border:1.5px dashed var(--brand);border-radius:14px;padding:12px;margin:14px 0;text-align:center}
.id-val{font-family:monospace;font-size:22px;font-weight:700;letter-spacing:2px;color:var(--brand);margin-top:4px}
.pub-ia{background:var(--brand-soft);border:1.5px solid var(--brand);border-radius:14px;padding:14px;margin:14px 0;font-size:14.5px;line-height:1.4}
.pub-ia b{color:var(--brand)}
.barre-apify{display:flex;gap:8px;margin-top:12px}.barre-apify input{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-height:46px}
.ia-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ia-chips button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;min-height:36px}
.ia-box{margin-top:14px;font-size:14.5px;max-height:300px;overflow:auto;line-height:1.55;padding:12px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.ia-msg{padding:10px 12px;border-radius:12px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line)}
.ia-msg.user{background:var(--brand-soft);border-color:var(--brand);font-weight:600}
.ia-msg-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ia-local-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
input[type=date]{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;min-height:42px;font:inherit;color:var(--ink)}
.pm{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pm-l{flex:1}.pm-n{font-weight:700}.pm-v{font-family:monospace;font-size:13px;color:var(--muted)}

/* Chargement & Toast */
.loader-box{margin:24px 0;padding:28px 20px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.spinner{width:34px;height:34px;border:3.5px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:60;max-width:92%;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);text-align:center}

var RECTO_CP1252_REV = {
  0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,
  0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F
};
window.RECTO_FIX_UTF8 = function(s){
  s = String(s == null ? '' : s);
  if (!/[ÃÂÅâ]/.test(s)) return s;
  for (var pass = 0; pass < 2 && /[ÃÂÅâ]/.test(s); pass++) {
    s = s.replace(/[\x80-\xFF\u20AC\u201A\u0192\u201E\u2026\u2020\u2021\u02C6\u2030\u0160\u2039\u0152\u017D\u2018\u2019\u201C\u201D\u2022\u2013\u2014\u02DC\u2122\u0161\u203A\u0153\u017E\u0178A-Za-z0-9\s.,;:'"!?()\[\]{}\/\\+\-_=*@#%&<>|]+/g, function(chunk){
      if (!/[ÃÂÅâ]/.test(chunk)) return chunk;
      try {
        var bytes = new Uint8Array(chunk.length);
        for (var i = 0; i < chunk.length; i++) {
          var code = chunk.charCodeAt(i);
          bytes[i] = code <= 0xFF ? code : RECTO_CP1252_REV[code];
        }
        if (typeof TextDecoder !== 'undefined') {
          return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        }
        var bin = '';
        for (var j = 0; j < bytes.length; j++) bin += '%' + ('0' + bytes[j].toString(16)).slice(-2);
        return decodeURIComponent(bin);
      } catch (e) { return chunk; }
    });
  }
  return s;
};

window.RECTO_NORMALIZE_COURSE = function(cours){
  if (!cours || !cours.id) return null;

  return {

window.APIFY_CONFIG = {
  endpointProxy: "/api/chat",
  vercelProxy: "https://recto-rdc.vercel.app/api/chat",
  fallbackProxy: "/api/apify",
  interroger: async function(question, contexte, signal) {
    var payload = JSON.stringify({
      question: question,
      courseName: (contexte && contexte.courseName) || "",
      sectionName: (contexte && contexte.sectionName) || "",
      history: (contexte && contexte.history) || []
    });
    var host = (window.location && window.location.hostname) || "";
    var isGithubPages = /\.github\.io$/i.test(host) || window.location.protocol === "file:";
    var endpoints = isGithubPages
      ? [this.vercelProxy]
      : [this.endpointProxy, this.fallbackProxy, this.vercelProxy];
    var lastReason = "";

    for (var i = 0; i < endpoints.length; i++) {
      var ep = endpoints[i];
      if (!ep) continue;
      try {
        var repProxy = await fetch(ep, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: payload,
          signal: signal
        });
        if (repProxy.status === 404 && i < endpoints.length - 1) {
          lastReason = "Route introuvable (" + ep + " · 404)";
          continue;
        }
        var jsonProxy = null;
        try { jsonProxy = await repProxy.json(); } catch (_) {}
        var ans = jsonProxy && (jsonProxy.answer || jsonProxy.text || jsonProxy.reply || jsonProxy.message);
        if (repProxy.ok && ans && (!jsonProxy || jsonProxy.ok !== false)) {
          return { ok: true, answer: String(ans), source: "ai" };
        }
        if (repProxy.status === 503) {
          return {
            ok: false,
            answer: (jsonProxy && jsonProxy.error) || "Le Chat IA en ligne attend la configuration de GEMINI_API_KEY sur Vercel (Settings > Environment Variables)."
          };
        }
        if (jsonProxy && jsonProxy.error) {
          return { ok: false, answer: String(jsonProxy.error) };
        }
        lastReason = "HTTP " + repProxy.status + " sur " + ep;
      } catch (e) {
        if (e && e.name === "AbortError") {
          return { ok: false, answer: "La requête a expiré. Vérifiez votre connexion internet et réessayez." };
        }
        lastReason = "Réseau/CORS sur " + ep;
      }
    }

    return {
      ok: false,
      answer: "Service Chat IA indisponible (" + (lastReason || "erreur réseau") + "). Les fiches officielles restent accessibles ci-dessous."
    };
  }
};

(function(){
  var KEY = 'recto:v1';
  var AI_CACHE_KEY = 'recto:ai_cache:v1';
  var AI_CACHE_MAX = 40;
  var AI_CACHE_TTL = 7 * 86400000; // 7 jours
  var MAX_COURSES_IN_MEM = 3; // Évite de saturer la RAM mobile quand beaucoup de cours seront ajoutés
  var MIX_SIZE = 15;
  var memory = null;
  var deferredInstallPrompt = null;
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/.test((window.navigator.userAgent || '').toLowerCase());
  var toastTimer = null;

  /* --- Cache LRU en mémoire pour les cours --- */
  var courseCache = new Map();
  var loadingPromises = {};
  var BASE_COURSE_TOTALS = { geo: 350, chimie: 1200 };
  var courseTotalsMem = {};

  function getCourseMeta(id){
    for (var i = 0; i < window.SECTIONS_OFFICIELLES.length; i++) {
      var sec = window.SECTIONS_OFFICIELLES[i];
      for (var j = 0; j < sec.cours.length; j++) {
        if (sec.cours[j].id === id) return { meta: sec.cours[j], section: sec.section };
      }
    }
    return null;
  }

  function courseFileName(id){
    var info = getCourseMeta(id);
    if (info && info.meta.fichier) return info.meta.fichier;
    return id + '_data.js';
  }

  function countCourseQuestions(norm){
    var totalQ = 0;
    (norm && norm.parts || []).forEach(function(p){
      (p.ch || []).forEach(function(ch){
        (ch.ls || []).forEach(function(l){
          totalQ += (l.c || []).length;
        });
      });
    });
    return totalQ;
  }

  function putCourseInCache(rawCourse){
    var norm = window.RECTO_NORMALIZE_COURSE(rawCourse);
    if (!norm) return null;
    if (courseCache.has(norm.id)) courseCache.delete(norm.id);
    courseCache.set(norm.id, norm);
    var totalQ = countCourseQuestions(norm);
    courseTotalsMem[norm.id] = totalQ;
    if (typeof data !== 'undefined' && data) {
      if (!data.courseTotalsCache) data.courseTotalsCache = {};
      if (data.courseTotalsCache[norm.id] !== totalQ) {
        data.courseTotalsCache[norm.id] = totalQ;
        save();
      }
    }
    // Garder au maximum MAX_COURSES_IN_MEM cours lourds en RAM (sans évincer le cours actif)
    var activeId = (typeof data !== 'undefined' && data) ? data.course : 'geo';
    if (courseCache.size > MAX_COURSES_IN_MEM) {
      var keys = Array.from(courseCache.keys());
      for (var i = 0; i < keys.length && courseCache.size > MAX_COURSES_IN_MEM; i++) {
        if (keys[i] !== activeId) courseCache.delete(keys[i]);
      }
    }
    window.RECTO_COURSES = Array.from(courseCache.values());
    return norm;
  }

  window.RECTO_REGISTER_COURSE = function(cours){
    return putCourseInCache(cours);
  };

  // Absorber d'éventuels cours déjà enregistrés avant le démarrage
  (window.RECTO_COURSES || []).forEach(putCourseInCache);

  function chargerCours(id){
    if (courseCache.has(id)) {
      var hit = courseCache.get(id);
      courseCache.delete(id);
      courseCache.set(id, hit);
      return Promise.resolve(hit);
    }
    if (loadingPromises[id]) return loadingPromises[id];

    var src = courseFileName(id);
    loadingPromises[id] = new Promise(function(resolve, reject){
      var done = false;
      var script = document.createElement('script');
      script.charset = 'utf-8';
      script.src = src;
      script.async = true;

      var timer = setTimeout(function(){
        if (done) return;
        done = true;
        delete loadingPromises[id];
        script.remove();
        reject(new Error("Délai dépassé lors du chargement de " + src));
      }, 15000);

      script.onload = function(){
        if (done) return;
        done = true;
        clearTimeout(timer);
        delete loadingPromises[id];

        // Support rétrocompatible si un fichier utilise window.COURSE_GEO ou window.RECTO_COURSES.push
        (window.RECTO_COURSES || []).forEach(putCourseInCache);
        if (id === 'geo' && !courseCache.has('geo') && window.COURSE_GEO) {
          putCourseInCache({
            id: 'geo',
            name: 'Géographie',
            sub: 'RDC et Afrique contemporaine',
            heroTitle: 'Géographie – Exétat 2027',
            heroSub: 'Programme officiel de 6e année : RDC et Afrique contemporaine.',
            parts: window.COURSE_GEO
          });
        }
        var loaded = courseCache.get(id);
        if (loaded) {
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            try { navigator.serviceWorker.controller.postMessage({ type: 'CACHE_COURSE', url: './' + src }); } catch(_){}
          }
          resolve(loaded);
        }
        else reject(new Error("Le fichier " + src + " ne contient pas de données valides pour « " + id + " »."));
      };

      script.onerror = function(){
        if (done) return;
        done = true;
        clearTimeout(timer);
        delete loadingPromises[id];
        script.remove();
        reject(new Error("Impossible de charger " + src + " (hors-ligne ou fichier absent)."));
      };

      document.body.appendChild(script);
    });

    return loadingPromises[id];
  }

  /* --- Utilitaires, Formules scientifiques & Synthèse vocale --- */
  function uid(){ return Math.random().toString(36).slice(2, 10); }
  function esc(s){
    var txt = window.RECTO_FIX_UTF8 ? window.RECTO_FIX_UTF8(s) : String(s == null ? '' : s);
    return txt.replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  function formatSci(s){
    var out = esc(s);
    // Flèches & opérateurs scientifiques
    out = out.replace(/&lt;=&gt;|&lt;-&gt;/g, ' &#8652; ')
      .replace(/-&gt;|=&gt;/g, ' &rarr; ')
      .replace(/&gt;=/g, '&ge;')
      .replace(/&lt;=/g, '&le;')
      .replace(/!=/g, '&ne;')
      .replace(/\+\/-/g, '&plusmn;');
    // Exposants explicites ^(val) ou ^val (ions, puissances de 10, x^2, mol^-1)
    out = out.replace(/\^\(([^)]+)\)/g, '<sup>$1</sup>');
    out = out.replace(/\^([+-]?\d+[+-]?|[+-])/g, '<sup>$1</sup>');
    out = out.replace(/([A-Za-zÀ-ÿ0-9\)])\^([a-zA-Z0-9+-]+)/g, '$1<sup>$2</sup>');
    // Unités SI carrées et cubes (m2, km2, cm3, s2)
    out = out.replace(/\b(km|hm|dam|dm|cm|mm|m|s)([23])\b/g, '$1<sup>$2</sup>');
    // Couches électroniques complètes (K2 L8 M1...)
    out = out.replace(/(?:\b[KLMNO]\d{1,2}\s+)+[KLMNO]\d{1,2}\b/g, function(seq){
      return seq.replace(/([KLMNO])(\d{1,2})/g, '$1<sup>$2</sup>');
    });
    // Indices chimiques après parenthèse fermante : (OH)2, (PO4)2
    out = out.replace(/\)(\d+)/g, ')<sub>$1</sub>');
    // Composés chimiques complets (avec ou sans parenthèses : Ca3(PO4)2, H2SO4, Fe2O3) + molécules simples
    out = out.replace(/\b(?:(?:[A-Z][a-z]?\d*){2,}|[A-Z][a-z]?\d+(?=\()|(?:H2|O2|N2|Cl2|Br2|I2|F2|CO2|CO3|SO2|SO3|SO4|NO2|NO3|PO4|NH3|NH4|CH4|H3O))\b/g, function(tok){
      return tok.replace(/([A-Za-z])(\d+)/g, '$1<sub>$2</sub>');
    });
    // Charges d'ions collées après indice ou formule : NH4+, SO4(2-), PO4(3-)
    out = out.replace(/(<\/sub>)([+-])(?=\s|$|[,.;:)])/g, '$1<sup>$2</sup>');
    out = out.replace(/(<\/sub>)\((\d+[+-]|[+-])\)/g, '$1<sup>$2</sup>');
    return '<span class="sci">' + out + '</span>';
  }

  var aiMemCache = new Map();
  function normaliserRequeteIA(q){
    return String(q || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();

  function lireStoreCacheIA(){
    try {
      var raw = localStorage.getItem(AI_CACHE_KEY);
      if (!raw) return {};
      var parsed = JSON.parse(raw);
      return (parsed && typeof parsed === 'object') ? parsed : {};
    } catch(e) { return {}; }
  }
  function ecrireStoreCacheIA(obj){
    try { localStorage.setItem(AI_CACHE_KEY, JSON.stringify(obj)); } catch(e) {}
  }
  function obtenirCacheIA(cleCache){
    var now = Date.now();
    if (aiMemCache.has(cleCache)) {
      var m = aiMemCache.get(cleCache);
      if (now - m.ts < AI_CACHE_TTL) {
        m.last = now;
        return m.val;
      }
      aiMemCache.delete(cleCache);
    }
    var store = lireStoreCacheIA();
    var rec = store[cleCache];
    if (rec && (now - rec.ts < AI_CACHE_TTL)) {
      rec.last = now;
      aiMemCache.set(cleCache, rec);
      ecrireStoreCacheIA(store);
      return rec.val;
    }
    return null;
  }
  function enregistrerCacheIA(cleCache, val){
    var now = Date.now();
    var entry = { val: val, ts: now, last: now };
    aiMemCache.set(cleCache, entry);
    var store = lireStoreCacheIA();
    store[cleCache] = entry;
    var keys = Object.keys(store);
    if (keys.length > AI_CACHE_MAX) {
      keys.sort(function(a, b){ return (store[a].last || 0) - (store[b].last || 0); });
      for (var i = 0; i < keys.length - AI_CACHE_MAX; i++) delete store[keys[i]];
    }
    ecrireStoreCacheIA(store);
  }

  function rechercherDansCoursLocal(query){
    var c = courseCache.get(data.course);
    if (!c || !c.parts) return [];
    var mots = normaliserRequeteIA(query).split(' ').filter(function(w){ return w.length >= 3; });
    if (!mots.length) return [];
    var hits = [];
    c.parts.forEach(function(p){
      p.ch.forEach(function(ch){
        ch.ls.forEach(function(l){
          l.c.forEach(function(item){
            var hay = normaliserRequeteIA(l.t + ' ' + item.q + ' ' + item.a);
            var score = 0;
            mots.forEach(function(m){ if (hay.indexOf(m) !== -1) score++; });
            if (score > 0) hits.push({ score: score, lesson: label(l), q: item.q, a: item.a });
          });
        });
      });
    });
    hits.sort(function(a, b){ return b.score - a.score; });
    return hits.slice(0, 3);
  }

    el.style.setProperty('--fs', ['17px', '19px', '21px'][data.fs || 0]);

  function totalCoursCatalogue(){

  function vueAccueil(){
    var c = curCourse();
    if (ui.loadingCourse === c.id) {
      return barreHaut() +

    var streak = getStreakCount(), todCount = getTodayCount(), goal = (data.streak && data.streak.goal) || 15, jRestants = daysUntilExam();
    h += '<div class="streak-bar">' +
      '<div class="streak-pill"><b>🔥 ' + plural(streak, 'jour', 'jours') + '</b><span>Série active</span></div>' +
      '<div class="streak-pill"><b>🎯 ' + todCount + '/' + goal + '</b><span>Objectif du jour</span></div>' +
      '<div class="streak-pill"><b>⏳ J-' + jRestants + '</b><span>Exétat RDC</span></div>' +
    '</div>';

    var info = getCourseMeta(c.id);
    h += '<div class="ia-strip">' +
      '<div class="ia-strip-t"><b>🤖 Chat IA — ' + esc(c.name) + '</b><span>' + esc(info ? info.section : 'Assistant Exétat') + '</span></div>' +

    '</div>';

    var parts = c.parts || [];

      h += '<p class="empty" style="text-align:center;margin:24px 0;padding:24px;border:2px dashed var(--line);border-radius:18px">Ce cours est programmé mais son fichier de questions (' + esc(courseFileName(c.id)) + ') n’est pas encore déposé.</p>';
    } else {
      var nbErr = courseMistakeItems().length;
      var nbSrs = courseSrsDueItems().length;
      var nbFav = courseFavItems().length;
      h += '<div class="quick-modes">' +
        '<button class="qmode-btn" data-a="lancerExamen"><div><b>📝 Examen blanc</b><span class="qm-sub">20 questions · 15 min</span></div><span class="qm-badge">Exétat</span></button>' +
        '<button class="qmode-btn" data-a="lancerSrs"' + (nbSrs ? '' : ' disabled style="opacity:.6"') + '><div><b>🔁 Rappel espacé</b><span class="qm-sub">Cartes dues aujourd’hui</span></div><span class="qm-badge">' + (nbSrs || 'À jour') + '</span></button>' +
        (nbErr ? '<button class="qmode-btn warn" data-a="lancerErreurs"><div><b>🎯 Mes erreurs</b><span class="qm-sub">À corriger en priorité</span></div><span class="qm-badge">' + nbErr + '</span></button>' : '') +
        (nbFav ? '<button class="qmode-btn" data-a="lancerFavoris"><div><b>⭐ Mes favoris</b><span class="qm-sub">Fiches épinglées</span></div><span class="qm-badge">' + nbFav + '</span></button>' : '') +
      '</div>';
      h += '<div class="course-tools"><input type="text" id="filtreLecons" placeholder="Filtrer une leçon de ' + esc(c.name) + '…" value="' + esc(ui.searchQuery) + '" aria-label="Filtrer les leçons"></div>';
    }

    var filtre = normaliserRequeteIA(ui.searchQuery);
    var totalTrouve = 0;
    var bonusDejaUtilise = !!(data.bonusUnlocked && data.bonusUnlocked[c.id]);
    var bonusEligible = (!data.pro && !bonusDejaUtilise && tot.k >= 10);

    parts.forEach(function(p, pi){
      var partHtml = '';
      p.ch.forEach(function(chap){
        var ouvert = unlocked(chap);
        var lsFiltrees = chap.ls.filter(function(l){
          if (!filtre) return true;
          return normaliserRequeteIA(l.n + ' ' + l.t + ' ' + chap.t).indexOf(filtre) !== -1;
        });
        if (!lsFiltrees.length) return;
        totalTrouve += lsFiltrees.length;
        var estBonus = (!chap.free && !data.pro && ouvert);
        partHtml += '<div class="chap"><h3>' + esc(chap.t) + '</h3>' + (ouvert ? (estBonus ? '<span class="chip mini">Bonus débloqué</span>' : '') : '<span class="chip mini">Pro</span>') + '</div>';
        if (!ouvert && bonusEligible) {
          partHtml += '<div class="bonus-banner"><span><b>🎁 Défi 10 cartes réussi !</b> Débloquez ce chapitre gratuitement.</span>' +
            '<button class="btn small" data-a="debloquerBonus" data-id="' + esc(chap.t) + '" style="min-height:38px;padding:0 12px;font-size:13px">Débloquer</button></div>';
        }
        partHtml += '<ul class="list">';
        lsFiltrees.forEach(function(l){
          var k = lessonKnown(l), pc = l.c.length ? Math.round(k / l.c.length * 100) : 0;
          partHtml += '<li class="lrow" style="--c:' + colorVar(pi) + '">' +
            '<button class="lmain" data-a="' + (ouvert ? 'lecon' : 'modalPro') + '" data-id="' + esc(l.id) + '">' +
            '<span class="lbadge">' + (/^N/.test(l.n) ? ico('star', 16) : esc(l.n)) + '</span>' +
            '<span class="ltxt"><span class="deck-name">' + esc(l.t) + '</span>' +
            '<span class="deck-meta">' + plural(l.c.length, 'carte', 'cartes') + (ouvert ? ', ' + k + ' acquises' : ', réservé à Pro') + '</span>' +
            (ouvert ? '<span class="mini" style="--p:' + pc + '%"><i></i></span>' : '') + '</span></button>' +
            '<button class="go' + (ouvert ? '' : ' lockd') + '" data-a="' + (ouvert ? 'reviserLecon' : 'modalPro') + '" data-id="' + esc(l.id) + '" aria-label="' + (ouvert ? 'Réviser ' + esc(l.t) : 'Débloquer Pro') + '">' + (ouvert ? ico('play', 18) : ico('lock', 18)) + '</button></li>';
        });
        partHtml += '</ul>';
      });
      if (partHtml) {
        h += '<h2 class="part" style="--c:' + colorVar(pi) + '">' + esc(p.t) + '</h2>' + partHtml;
      }
    });

    if (parts.length && filtre && totalTrouve === 0) {
      h += '<p class="sub" style="text-align:center;margin:24px 0">Aucune leçon ne correspond à « ' + esc(ui.searchQuery) + ' ».</p>';
    }

    return h + '<p class="foot">Recto – Plateforme d’Examen d’État en RDC.</p>';
  }

    }
    opts = opts || {};
    ui.study = {

      known: 0,
      again: 0,
      total: queue.length,
      back: back,
      src: src,
      mode: opts.mode || 'study',
      secsLeft: opts.secsLeft || 0,
      results: [],
      finished: false
    };
    if (ui.study.mode === 'exam') {
      examTimerId = setInterval(function(){
        if (!ui.study || ui.study.mode !== 'exam' || ui.study.finished) { clearExamTimer(); return; }
        ui.study.secsLeft--;
        var el = document.getElementById('examTimer');
        if (el) {
          el.textContent = '⏱ ' + formatChrono(ui.study.secsLeft);
          if (ui.study.secsLeft <= 60) el.classList.add('low');

        if (ui.study.secsLeft <= 0) {

    ui.view = 'study'; render();

      ui.modal = 'pro';

    var ctx = ui.chatContext || { courseId: curCourse().id, courseName: curCourse().name, sectionName: '' };
    var cleCache = (ctx.courseId || ctx.sectionName || 'global') + '|' + normaliserRequeteIA(q);
    var localHits = rechercherDansCoursLocal(q);

    function pushHistory(ans, fromCache){
      ui.chatHistory.push({ q: q, a: ans, fromCache: !!fromCache });
      if (ui.chatHistory.length > 15) ui.chatHistory = ui.chatHistory.slice(-15);
    }

    // 1. Vérifier le cache multi-niveaux avant tout appel réseau
    var cached = obtenirCacheIA(cleCache);
    if (cached) {
      pushHistory(cached, true);
      ui.apifyState = { loading: false, query: '', answer: cached, fromCache: true, localHits: localHits };
      majZoneApify();
      var inp = document.getElementById('champApify'); if (inp) inp.value = '';
      return;
    }

    // 2. Si hors-ligne : répondre instantanément avec les fiches locales du cours
    if (navigator.onLine === false) {
      var offMsg = localHits.length
        ? "Vous êtes hors-ligne. Voici les fiches officielles correspondantes déjà disponibles sur votre appareil :"
        : "Vous êtes hors-ligne et cette question n’est pas encore en cache. Reconnectez-vous pour interroger le Chat IA.";
      pushHistory(offMsg, false);
      ui.apifyState = { loading: false, query: '', answer: offMsg, fromCache: false, localHits: localHits };
      majZoneApify();
      return;
    }

    // 3. Appel API avec AbortController (timeout 22s)
    if (activeAiAbort) activeAiAbort.abort();
    activeAiAbort = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var abortTimer = activeAiAbort ? setTimeout(function(){ activeAiAbort.abort(); }, 22000) : null;

    ui.apifyState = { loading: true, query: q, answer: '', fromCache: false, localHits: localHits };
    majZoneApify();

    try {
      var reqCtx = {
        courseId: ctx.courseId || "",
        courseName: ctx.courseName || "",
        sectionName: ctx.sectionName || "",
        history: (ui.chatHistory || []).slice(-4)
      };
      var res = await window.APIFY_CONFIG.interroger(q, reqCtx, activeAiAbort ? activeAiAbort.signal : undefined);
      if (abortTimer) clearTimeout(abortTimer);
      var ans = (res && res.answer) || "Aucune réponse reçue.";
      if (res && res.ok && res.answer) {
        enregistrerCacheIA(cleCache, res.answer);
      }
      pushHistory(ans, false);
      ui.apifyState = { loading: false, query: '', answer: ans, fromCache: false, localHits: localHits };
      var ch2 = document.getElementById('champApify'); if (ch2) ch2.value = '';
      majZoneApify();
    } catch (err) {
      if (abortTimer) clearTimeout(abortTimer);
      var errMsg = "Impossible de joindre le Chat IA (" + (err && err.message ? err.message : 'erreur réseau') + ").";
      pushHistory(errMsg, false);
      ui.apifyState = { loading: false, query: q, answer: errMsg, fromCache: false, localHits: localHits };
      majZoneApify();
    }
  }

  /* --- Gestion des événements --- */
  document.addEventListener('change', function(e){
    if (e.target && e.target.id === 'champDateExetat') {
      if (e.target.value) {
        data.examDate = e.target.value;
        save();
        afficherToast("Date de l’Exétat mise à jour.");
      }
    } else if (e.target && e.target.id === 'importSauvegarde') {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        try {
          var parsed = JSON.parse(String(reader.result || ''));
          if (!parsed || typeof parsed !== 'object' || !parsed.prog) throw new Error('Format invalide');
          data.prog = parsed.prog || data.prog;
          if (Array.isArray(parsed.decks)) data.decks = parsed.decks;
          if (parsed.mistakes) data.mistakes = parsed.mistakes;
          if (parsed.srs) data.srs = parsed.srs;
          if (parsed.favs) data.favs = parsed.favs;
          if (parsed.streak) data.streak = parsed.streak;
          if (parsed.bonusUnlocked) data.bonusUnlocked = parsed.bonusUnlocked;
          if (parsed.examDate) data.examDate = parsed.examDate;
          if (parsed.courseTotalsCache) data.courseTotalsCache = parsed.courseTotalsCache;
          if (parsed.pro && parsed.devId === data.devId) data.pro = true;
          save();
          afficherToast("Sauvegarde restaurée avec succès !");
          render();
        } catch(err) {
          afficherToast("Fichier de sauvegarde invalide.");
        }
      };
      reader.readAsText(file);
    }
  });

  document.addEventListener('input', function(e){
    if (e.target && e.target.id === 'filtreLecons') {
      ui.searchQuery = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var el = document.getElementById('filtreLecons');
      if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch(_){} }
    } else if (e.target && e.target.id === 'champApify') {
      ui.apifyState.query = e.target.value;
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target && e.target.id === 'champApify') {
      e.preventDefault();
      executerRechercheIA(e.target.value);
    }
  });

  document.addEventListener('click', async function(e){
    var overlayEl = e.target.closest('.overlay');
    var t = e.target.closest('[data-a]');
    if (!t) {
      if (overlayEl && e.target === overlayEl) { ui.modal = null; render(); }
      return;
    }
    var a = t.dataset.a, id = t.dataset.id;

    if (a === 'revenirAccueil') { clearExamTimer(); stopSpeech(); ui.view = 'landing'; ui.modal = null; ui.loadError = null; render(); }
    else if (a === 'entrerApp') { await ouvrirCoursParId(data.course || 'geo'); }
    else if (a === 'rechargerCours') { await ouvrirCoursParId(data.course || 'geo'); }
    else if (a === 'tab') {
      clearExamTimer(); stopSpeech();
      ui.view = id;
      if (id === 'home' && !courseCache.has(data.course)) await ouvrirCoursParId(data.course || 'geo');
      else render();
    }
    else if (a === 'lecon') { stopSpeech(); ui.view = 'lesson'; ui.lessonMode = 'cards'; ui.lessonId = id; render(); }
    else if (a === 'toggleLessonMode') { ui.lessonMode = (ui.lessonMode === 'synth') ? 'cards' : 'synth'; render(); }
    else if (a === 'ecouterLecon') {
      var recL = indexerLecons()[id];
      if (recL) {
        var fullTxt = recL.l.c.map(function(it, n){ return 'Question ' + (n + 1) + '. ' + it.q + '. Réponse : ' + it.a; }).join('. ');
        parlerTexte(fullTxt);
      }
    }
    else if (a === 'ecouterTxt') {
      var partsKey = String(id || '').split(':');
      var lid = partsKey[1], qIdx = +partsKey[2];
      var recT = indexerLecons()[lid];
      if (recT && recT.l && recT.l.c[qIdx]) {
        var cardT = recT.l.c[qIdx];
        parlerTexte(cardT.q + '. ' + cardT.a);
      }
    }
    else if (a === 'ecouterCarte') {
      if (ui.study && ui.study.queue[ui.study.idx]) parlerTexte(ui.study.queue[ui.study.idx].q);
    }
    else if (a === 'ecouterSynthese') {
      if (ui.study && ui.study.queue[ui.study.idx]) parlerTexte(ui.study.queue[ui.study.idx].a);
    }
    else if (a === 'toggleFav') {
      toggleFav(id);
      afficherToast(isFav(id) ? "Ajoutée aux favoris ★" : "Retirée des favoris");
      render();
    }
    else if (a === 'debloquerBonus') {
      data.bonusUnlocked[curCourse().id] = id;
      save();
      afficherToast("Chapitre bonus débloqué pour " + curCourse().name + " !");
      render();
    }
    else if (a === 'ouvrirTiroir') {
      document.getElementById('drawer').classList.add('ouvert');
      document.getElementById('drawerBackdrop').classList.add('ouvert');
    }
    else if (a === 'fermerTiroir') {
      document.getElementById('drawer').classList.remove('ouvert');
      document.getElementById('drawerBackdrop').classList.remove('ouvert');
    }
    else if (a === 'basculerSection') {
      var sIdx = +id; ui.secOuverte = (ui.secOuverte === sIdx) ? null : sIdx; majTiroirSections();
    }
    else if (a === 'ouvrirSection') {
      ui.secOuverte = +id;
      majTiroirSections();
      document.getElementById('drawer').classList.add('ouvert');
      document.getElementById('drawerBackdrop').classList.add('ouvert');
    }
    else if (a === 'reviserLecon') {
      var rec = indexerLecons()[id];
      if (!rec || !unlocked(rec.chap)) { ui.modal = 'pro'; render(); return; }
      begin(label(rec.l), order(lessonItems(rec.l, rec.chap.t)), { view: ui.view === 'lesson' ? 'lesson' : 'home', lessonId:id }, { type:'lesson', id:id });
    }
    else if (a === 'mix') {
      var items = unlockedCourseItems();
      begin('Révision mixte (' + curCourse().name + ')', order(items).slice(0, MIX_SIZE), { view:'home' }, { type:'mix' });
    }
    else if (a === 'lancerExamen') {
      var exItems = shuffle(unlockedCourseItems().filter(function(it){ return it.ok && it.ok.length; })).slice(0, 20);
      if (!exItems.length) exItems = shuffle(unlockedCourseItems()).slice(0, 20);
      begin('Examen blanc · ' + curCourse().name, exItems, { view:'home' }, { type:'exam' }, { mode:'exam', secsLeft: Math.max(300, exItems.length * 45) });
    }
    else if (a === 'lancerSrs') {
      begin('Rappel espacé (' + curCourse().name + ')', shuffle(courseSrsDueItems()), { view:'home' }, { type:'srs' });
    }
    else if (a === 'lancerErreurs') {
      begin('Mes erreurs (' + curCourse().name + ')', shuffle(courseMistakeItems()), { view:'home' }, { type:'mistakes' });
    }
    else if (a === 'lancerFavoris') {
      begin('Mes favoris (' + curCourse().name + ')', shuffle(courseFavItems()), { view:'home' }, { type:'favs' });
    }
    else if (a === 'setGoal') {
      data.streak.goal = +id || 15; save(); render();
    }
    else if (a === 'exporterSauvegarde') {
      try {
        var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = 'recto-sauvegarde-' + todayStr(0) + '.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
        afficherToast("Sauvegarde exportée !");
      } catch(err) {
        afficherToast("Impossible d’exporter sur cet appareil.");
      }
    }
    else if (a === 'theme') { data.theme = id; save(); render(); }
    else if (a === 'fs') { data.fs = +id; save(); render(); }
    else if (a === 'openDeck') { ui.view = 'deck'; ui.deckId = id; render(); }
    else if (a === 'studyDeck') {
      var d = deckById(id);
      if (d) begin(d.name, order(d.cards.map(function(c){ return { k:'u:'+c.id, q:c.q, a:c.a }; })), { view:'deck', deckId:id }, { type:'deck', id:id });
    }
    else if (a === 'creerDeck') {
      var inp = document.getElementById('newDeck'), n = inp ? inp.value.trim() : '';
      if (n) { data.decks.push({ id:uid(), name:n, cards:[] }); save(); render(); }
    }
    else if (a === 'addCard') {
      var d = deckById(ui.deckId), q = document.getElementById('cq').value.trim(), ca = document.getElementById('ca').value.trim();
      if (d && q && ca) { d.cards.push({ id:uid(), q:q, a:ca }); save(); render(); }
    }
    else if (a === 'delCard') {
      var d = deckById(ui.deckId);
      if (d) { d.cards = d.cards.filter(function(c){ return c.id !== id; }); save(); render(); }
    }
    else if (a === 'flip') {
      var s = ui.study, btn = document.querySelector('.flip');
      s.flipped = !s.flipped; btn.classList.toggle('is-flipped', s.flipped);
      document.getElementById('answers').hidden = !s.flipped;
      document.getElementById('hint').hidden = s.flipped;
    }
    else if (a === 'known') {
      var s = ui.study, c = s.queue[s.idx]; markKnown(c.k, true);
      s.known++; s.idx++; s.flipped = false; render();
    }
    else if (a === 'again') {
      var s = ui.study, c = s.queue[s.idx]; markKnown(c.k, false);
      s.again++; s.queue.push(c); s.idx++; s.flipped = false; render();
    }
    else if (a === 'opt') {
      var s = ui.study, q = curQ(s), c = s.queue[s.idx];
      if (q.done) return;
      if (c.ok && c.ok.length > 1) { if (q.sel[id]) delete q.sel[id]; else q.sel[id] = true; }
      else { q.sel = {}; q.sel[id] = true; }
      render();
    }
    else if (a === 'examSuivante') {
      var s = ui.study, q = curQ(s), c = s.queue[s.idx];
      var hasSel = Object.keys(q.sel).length > 0;
      var good = hasSel && q.opts.every(function(o, i){ return o.ok === !!q.sel[i]; });
      markKnown(c.k, good);
      if (good) s.known++; else s.again++;
      s.results.push({ q: c.q, a: c.a, good: good, chap: c.chapTitle });
      s.idx++;
      if (s.idx >= s.queue.length) finishExam();
      else render();
    }
    else if (a === 'examTerminer') {
      var s = ui.study;
      for (var ei = s.idx; ei < s.queue.length; ei++) {
        var ec = s.queue[ei];
        s.again++;
        s.results.push({ q: ec.q, a: ec.a, good: false, chap: ec.chapTitle });
      }
      finishExam();
    }
    else if (a === 'validerQuiz') {
      var s = ui.study, q = curQ(s), c = s.queue[s.idx];
      if (q.done || !Object.keys(q.sel).length) return;
      q.good = q.opts.every(function(o, i){ return o.ok === !!q.sel[i]; });
      q.done = true;
      if (q.good) { s.known++; markKnown(c.k, true); } else { s.again++; markKnown(c.k, false); s.queue.push(c); }
      render();
    }
    else if (a === 'idk') {
      var s = ui.study, q = curQ(s), c = s.queue[s.idx];
      q.done = true; q.good = false; s.again++; markKnown(c.k, false); s.queue.push(c);
      render();
    }
    else if (a === 'suivante') { stopSpeech(); ui.study.idx++; render(); }
    else if (a === 'restart') {
      var src = ui.study.src;
      if (src.type === 'lesson') { var r = indexerLecons()[src.id]; begin(label(r.l), order(lessonItems(r.l, r.chap.t)), ui.study.back, src); }
      else if (src.type === 'deck') { var d = deckById(src.id); if (d) begin(d.name, order(d.cards.map(function(c){ return { k:'u:'+c.id, q:c.q, a:c.a }; })), ui.study.back, src); }
      else if (src.type === 'mix') { begin('Révision mixte (' + curCourse().name + ')', order(unlockedCourseItems()).slice(0, MIX_SIZE), ui.study.back, src); }
      else if (src.type === 'srs') { begin('Rappel espacé (' + curCourse().name + ')', shuffle(courseSrsDueItems()), ui.study.back, src); }
      else if (src.type === 'mistakes') { begin('Mes erreurs (' + curCourse().name + ')', shuffle(courseMistakeItems()), ui.study.back, src); }
      else if (src.type === 'favs') { begin('Mes favoris (' + curCourse().name + ')', shuffle(courseFavItems()), ui.study.back, src); }
      else render();
    }
    else if (a === 'quit') { clearExamTimer(); stopSpeech(); ui.view = ui.study ? ui.study.back.view : 'home'; ui.study = null; render(); }
    else if (a === 'btnChatIa' || a === 'btnChatIaCours' || a === 'btnChatIaSection') {
      var statAi = aiEstEligible();
      if (!statAi.autorise) { ui.modal = 'pro'; render(); return; }
      if (a === 'btnChatIaSection') {
        var secObj = window.SECTIONS_OFFICIELLES[+id];
        ui.chatContext = { sectionName: secObj ? secObj.section : '', courseName: '', courseId: '' };
        document.getElementById('drawer').classList.remove('ouvert');
        document.getElementById('drawerBackdrop').classList.remove('ouvert');
      } else {
        var info = getCourseMeta(curCourse().id);
        ui.chatContext = { courseId: curCourse().id, courseName: curCourse().name, sectionName: info ? info.section : '' };
      }
      ui.apifyState = { loading: false, query: '', answer: '', fromCache: false, localHits: [] };
      ui.modal = 'apify';
      render();
      var ch = document.getElementById('champApify'); if (ch) ch.focus();
    }
    else if (a === 'sauverIaCarte') {
      var mItem = ui.chatHistory[+id];
      if (mItem) saveAiCardToDeck(mItem.q, mItem.a);
    }
    else if (a === 'effacerChat') {
      ui.chatHistory = [];
      majZoneApify();
    }
    else if (a === 'suggestionIa') {
      var ch = document.getElementById('champApify');
      var themeTxt = (ui.chatContext && (ui.chatContext.courseName || ui.chatContext.sectionName)) || curCourse().name;
      if (ch) {
        ch.value = id + themeTxt + ' : ';
        ui.apifyState.query = ch.value;
        ch.focus();
      }
    }
    else if (a === 'modalPro') { ui.modal = 'pro'; ui.msg = null; render(); }
    else if (a === 'fermerModale') { ui.modal = null; render(); }
    else if (a === 'copierId') { copierTexte(data.devId, "ID appareil copié : " + data.devId); }
    else if (a === 'payerMaishaPay') { window.MAISHAPAY_CONFIG.lancerPaiement(afficherToast); }
    else if (a === 'validerSignature') {
      var val = (document.getElementById('codeSecurise').value || '').trim();
      if (!val) { ui.msg = { ok: false, t: "Veuillez coller le code reçu." }; render(); return; }
      var ok = await verifierCodeClient(val);
      if (ok) {
        data.pro = true; save();
        ui.msg = { ok: true, t: "Code authentique ! Recto Pro est activé à vie." };
        setTimeout(function(){ ui.modal = null; render(); }, 1500);
      } else {
        ui.msg = { ok: false, t: "Code invalide pour cet appareil." };
      }
      render();
    }
    else if (a === 'lancerApify') {
      var champ = document.getElementById('champApify');
      await executerRechercheIA(champ ? champ.value : ui.apifyState.query);
    }
    else if (a === 'choisirCours') {
      var metaInfo = getCourseMeta(id);
      if (metaInfo && (metaInfo.meta.dispo || courseCache.has(id))) {
        await ouvrirCoursParId(id);
      } else {
        afficherToast("Cette matière fait partie du programme officiel. Son fichier de questions sera bientôt disponible.");
      }
    }
    else if (a === 'installerPwa') {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        render();
      }
    }
    else if (a === 'aideIosPwa') {
      ui.modal = 'ios';
      render();
    }
    else if (a === 'viderCacheIa') {
      aiMemCache.clear();
      try { localStorage.removeItem(AI_CACHE_KEY); } catch(err){}
      afficherToast("Cache du Chat IA vidé.");
    }
  });

  window.addEventListener('online', function(){ if (ui.view !== 'study') render(); });
  window.addEventListener('offline', function(){ if (ui.view !== 'study') render(); });
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    if (ui.view === 'landing' || ui.view === 'settings') render();
  });
  window.addEventListener('error', function(){
    if (!app.innerHTML || app.innerHTML.indexOf('Chargement de Recto') !== -1) render();
  });

  render();
  // Préchargement silencieux du dernier cours utilisé pour une ouverture instantanée
  chargerCours(data.course || 'geo').catch(function(){});

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function(){
      try {
        navigator.serviceWorker.register('./sw.js').then(function(reg){
          if (reg && reg.update) reg.update().catch(function(){});
        }).catch(function(){});
      } catch (e) {}
    });
  }
})();
</script>
</body>
</html>
