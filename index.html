<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A5C78">
<title>Recto – Géographie 6e année (RDC) & Cours modulaires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F2;--surface:#FFFFFF;--surface2:#F4F7F6;--ink:#0E2A38;--muted:#4F656E;--line:#D3DEDC;
  --brand:#0A5C78;--on-brand:#FFFFFF;--brand-soft:#DCEEF4;--sel:#DCEEF4;
  --good:#1B7A53;--good-bg:#DDF1E7;--bad:#B3322F;--bad-bg:#FBE4E1;
  --hero1:#0A5C78;--hero2:#0C3A50;
  --shadow:0 1px 2px rgba(14,42,56,.06),0 8px 22px rgba(14,42,56,.08);
  --font-d:'Fraunces',Georgia,serif;
  --font-b:'Source Sans 3',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08161D;--surface:#0F2530;--surface2:#12303D;--ink:#E6F1F2;--muted:#9DB3BB;--line:#1E3B48;
    --brand:#62BBD8;--on-brand:#04212C;--brand-soft:#123A4A;--sel:#123A4A;
    --good:#5FD3A0;--good-bg:#11382B;--bad:#FF908A;--bad-bg:#3F1B1A;
    --hero1:#12485E;--hero2:#0A2B3A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#08161D;--surface:#0F2530;--surface2:#12303D;--ink:#E6F1F2;--muted:#9DB3BB;--line:#1E3B48;
  --brand:#62BBD8;--on-brand:#04212C;--brand-soft:#123A4A;--sel:#123A4A;
  --good:#5FD3A0;--good-bg:#11382B;--bad:#FF908A;--bad-bg:#3F1B1A;
  --hero1:#12485E;--hero2:#0A2B3A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:17px;line-height:1.5;}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 60px;}
h1,h2,h3{font-family:var(--font-d);margin:0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:2px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:700;cursor:pointer;text-decoration:none;}
.list{list-style:none;margin:12px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;}
.lrow{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:12px 16px;}
.lrow:last-child{border-bottom:0;}
.ltxt{flex:1;}
.deck-name{font-weight:700;font-size:16px;}
.deck-meta{font-size:13px;color:var(--muted);}
.hero{margin-top:12px;padding:22px;border-radius:24px;color:#fff;background:linear-gradient(140deg,var(--hero1),var(--hero2));box-shadow:var(--shadow);}
.hero h2{font-size:26px;color:#fff;margin-bottom:6px;}
.hero p{margin:0;opacity:.9;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="hero">
    <h2>Recto – Géographie & Cours RDC</h2>
    <p>Chargement des fichiers modulaires de cours en cours...</p>
  </div>
</div>

<!-- ================================================================= -->
<!-- CHARGEMENT DES FICHIERS DE MATIÈRES SÉPARÉS                       -->
<!-- Vous pourrez ajouter d'autres fichiers ici (ex: chimie.js, etc.)  -->
<!-- ================================================================= -->
<script src="geographie.js"></script>
<!-- <script src="chimie.js"></script> -->

<script>
(function(){
  // Assemblage dynamique de tous les cours chargés depuis les différents fichiers
  var COURSE = [].concat(
    window.COURSE_GEO || []
    // window.COURSE_CHIMIE || [] // Prêt pour vos futurs fichiers !
  );

  var app = document.getElementById('app');

  function renderHome() {
    if (!COURSE || COURSE.length === 0) {
      app.innerHTML = `
        <div class="hero">
          <h2>Aucun cours trouvé</h2>
          <p>Vérifiez que le fichier <strong>geographie.js</strong> est bien présent dans le même dossier.</p>
        </div>`;
      return;
    }

    var html = `
      <div class="hero">
        <h2>Recto – Géographie (RDC)</h2>
        <p>Application modulaire prête pour l'intégration de nouvelles matières.</p>
      </div>
    `;

    COURSE.forEach(function(part, pIdx) {
      html += `<h3 style="margin-top:24px;font-size:20px;color:var(--brand);">${part.t}</h3>`;
      part.ch.forEach(function(chap, cIdx) {
        html += `<div style="margin-top:12px;font-weight:700;color:var(--muted);font-size:14px;">${chap.t}</div>`;
        html += `<ul class="list">`;
        chap.ls.forEach(function(les) {
          html += `
            <li class="lrow">
              <div class="ltxt">
                <span class="deck-name">${les.n}</span>
                <span class="deck-meta">${les.c.length} questions / fiches disponibles</span>
              </div>
            </li>
          `;
        });
        html += `</ul>`;
      });
    });

    app.innerHTML = html;
  }

  document.addEventListener('DOMContentLoaded', renderHome);
})();
</script>
</body>
</html>
