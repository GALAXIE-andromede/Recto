FIX.g6={0:"Environ 4 700 km : deuxième fleuve d’Afrique après le Nil (6 671 km) ; débit moyen d’environ 50 000 m³/s, le plus puissant d’Afrique et le deuxième du monde après l’Amazone.",1:"Le fleuve naît au Katanga (mont Musofi) ; son cours supérieur porte le nom de Lualaba jusqu’à Kisangani. Il se jette dans l’Atlantique par un vaste estuaire, à Banana (Muanda).",7:"Le plus profond lac d’Afrique (environ 1 435 m) et le deuxième du monde après le Baïkal ; c’est le plus vaste lac de la RDC, partagé avec la Tanzanie, le Burundi et la Zambie."};
FIX.g7={0:"Environ 87 millions d’habitants selon le manuel, plus de 100 millions selon les estimations récentes ; le dernier recensement général date de 1984 (environ 30 millions).",1:"Cinq groupes : Pygmées (Mbuti, plus anciens habitants de la forêt), Bantous (majorité, environ deux tiers du territoire), Soudanais (Nord), Nilotiques (Nord-Est) et Hamitiques (Kivu).",3:"Elle croît rapidement (environ 3 % par an). Selon le manuel, elle a quintuplé en soixante ans (10 millions en 1940, 30 millions en 1984).",5:"Fortes densités (plus de 50 hab./km², jusqu’à plus de 200 dans certains territoires du Kivu) : hautes terres de l’Est, au climat tempéré et aux sols volcaniques fertiles. Densités moyennes (10 à 20) : plateaux de l’Uélé, de l’Ubangi et du Kasaï. Faibles (moins de 10) : cuvette centrale et une partie du Katanga."};
FIX.g8={0:"La part de la population totale qui vit dans les villes (environ 40 % en RDC selon le manuel)."};
FIX.g11_12={3:"Café arabica et thé : hautes terres de l’Est (Kivu, Ituri). Café robusta : Uélé, Ubangi, Maniema, Kasaï. Cacao et hévéa : cuvette centrale (Équateur, Mai-Ndombe) et Mayumbe. Palmier à huile : Équateur, Mai-Ndombe, Kwilu, Mayumbe. Canne à sucre : Kongo-Central, Sud-Kivu, Tshopo.",4:"Plantations Lever au Congo (PLC, aujourd’hui PHC) pour le palmier ; sucreries de Kwilu-Ngongo (Kongo-Central), de Kiliba (Sud-Kivu) et de Lotokila (Tshopo) pour la canne à sucre.",5:"Pêche fluviale et lacustre très répandue (fleuve Congo, lacs Albert, Édouard, Tanganyika, Moero, Tumba, Mai-Ndombe) ; pêche semi-industrielle (Kalemie-Kalundu, Vitshumbi, Kasenyi) ; pêche maritime peu développée (PEMARCO à Moanda). Élevage limité par la mouche tsé-tsé, plus développé à l’Est et au Sud-Est."};
FIX.g13={0:"Les mines sont la principale source de devises (environ 70 % selon le manuel).",4:"Kilo-Moto (Ituri, Haut-Uélé), Kivu (Kamituga, Namoya…) et Maniema ; sociétés : OKIMO, SOMINKI et Gécamines.",6:"Au littoral, au large de Muanda (Kongo-Central), seule province productrice ; raffiné à Moanda par la SOCIR. Des bassins (cuvette centrale, lac Tanganyika, Semliki) restent inexploités.",7:"Le cobalt est associé au cuivre (Kolwezi : Kamoto, Musonoi). La RDC détient l’essentiel des réserves mondiales et est aujourd’hui le premier producteur mondial (le manuel, plus ancien, la classait 1re d’Afrique et 6e du monde)."};
FIX.g14_15={2:"Au Katanga (Luena) et à Lukuga, près de Kalemie. La RDC est pauvre en houille et en importe d’Afrique du Sud.",5:"Inga, sur le bas Congo (chutes Yellela, environ 40 km en amont de Matadi) : Inga I et II existent ; Inga III et le Grand Inga sont des projets. Une ligne à haute tension relie Inga à Kolwezi (environ 1 700 km).",6:"Le manuel parle du plus grand potentiel d’Afrique (environ 18 % du potentiel mondial) ; ordre de grandeur : plus de 100 000 MW, exploité en très petite partie."};
FIX.g16_17={0:"L’industrie pèse peu dans l’économie (environ 13 % de la main-d’œuvre selon le manuel) ; les industries extractives sont les plus anciennes et les plus développées.",2:"Brasseries (Bralima, Bracongo, Brasimba), textile (Utexco à Kinshasa, Sotexki à Kisangani, Utexafrica à Lubumbashi), sidérurgie (Sosider, Maluku), ciment (CILU à Lukala, CINAT à Kimpese), raffinerie SOCIR (Moanda)."};
FIX.g18={2:"Matadi–Kinshasa (366 km, construit entre 1890 et 1898), Lubumbashi–Ilebo, Kindu–Kalemie, Kisangani–Ubundu et, au Nord, Bumba–Aketi–Isiro–Mungbere. Le réseau compte environ 5 110 km.",5:"Plus de 13 000 km de voies navigables, entrecoupées de chutes et de rapides : le fleuve est navigable par biefs. Ports fluviaux : Kinshasa, Ilebo, Mbandaka. Lacs : Tanganyika (Kalemie, Kalundu, Moba), Kivu (Bukavu, Goma).",7:"Cinq aéroports internationaux : N’djili (Kinshasa), Luano (Lubumbashi), Goma, Bangboka (Kisangani) et Gbadolite ; Bipemba (Mbuji-Mayi) est le 2e aéroport par le trafic. Il y a environ 40 aéroports au total.",9:"Réseau de 170 000 km dont environ 6 000 km seulement asphaltés. Problèmes : routes en terre mal entretenues, rail et bateaux vétustes, aéroports peu équipés, coûts élevés, insécurité."};
FIX.g19={0:"Il se fait à l’intérieur du pays : échanges intra-provinciaux (villes et campagnes d’une même province) et interprovinciaux (entre provinces, par exemple vers Kinshasa).",3:"La différence entre la valeur des exportations et celle des importations : excédentaire si les exportations dominent, déficitaire sinon (le manuel la décrit comme déficitaire).",4:"Selon le manuel : Belgique, Union européenne, Chine, Japon, Canada et Afrique du Sud (l’ordre varie selon les années)."};
FIX.g20={0:"Quatre niveaux : maternel, primaire (certificat de fin d’études primaires), secondaire (6 ans, diplôme d’État ; types général, normal et technique) et supérieur et universitaire."};
FIX.g22={2:"Kinshasa, Kongo Central, Kwango, Kwilu et Mai-Ndombe (anciennement Kinshasa, Bas-Congo et Bandundu).",3:"Kasaï, Kasaï-Central, Kasaï-Oriental, Lomami et Sankuru (issues de l’ancien Kasaï Occidental et du Kasaï Oriental).",5:"Équateur, Mongala, Nord-Ubangi, Sud-Ubangi, Tshuapa, Bas-Uélé, Haut-Uélé, Ituri et Tshopo (anciens Équateur et Province Orientale).",6:"Les quatre provinces issues de l’ancien Katanga : Haut-Katanga, Haut-Lomami, Lualaba et Tanganyika."};
FIX.g23={0:"À l’est de Kinshasa. Le chef-lieu est la ville de Bandundu (aujourd’hui chef-lieu du Kwilu) ; l’ancienne province est divisée en Kwango, Kwilu et Mai-Ndombe."};
FIX.g24={0:"Matadi, port sur l’estuaire du fleuve ; le Kongo Central est la seule province ayant un accès direct à l’océan Atlantique.",3:"Barrages d’Inga et de Zongo (Sanga), cimenteries de Lukala (CILU) et de Kimpese (CINAT), raffinerie de Moanda (SOCIR), pétrole de Muanda, sucrerie de Kwilu-Ngongo."};
FIX.g25={1:"Premier pôle économique du pays (plus de 90 % des industries manufacturières selon le manuel) et grand centre universitaire."};
FIX.g27={0:"Kananga (aujourd’hui chef-lieu du Kasaï-Central ; Tshikapa est celle du Kasaï)."};
FIX.g29={6:"Goma, Butembo et Beni : les trois villes de la province."};
FIX.g31={1:"C’est une province essentiellement agricole et enclavée (loin des côtes, avec peu de routes). Maniema signifie « forêt galerie »."};
FIX.g33={0:"Kisangani, sur le fleuve Congo (3e pôle économique selon le programme) ; chef-lieu de la Tshopo depuis le découpage.",1:"Dans l’ancien découpage, c’était la plus vaste province du pays, essentiellement agricole. Aujourd’hui, la Tshopo (environ 199 600 km²) est la plus vaste des 26 provinces."};
FIX.g34={0:"Lubumbashi, deuxième ville du pays et deuxième pôle économique ; chef-lieu du Haut-Katanga."};
FIX.g40={1:"Environ 30,3 millions de km² : troisième continent après l’Asie et l’Amérique (l’Amérique étant comptée comme un seul continent) ; deuxième après l’Asie si l’on sépare les deux Amériques."};
FIX.g41={0:"Plus de 1,3 milliard d’habitants (environ 1,4 milliard aujourd’hui), soit environ 18 % de l’humanité ; densité moyenne d’environ 43 hab./km² selon le manuel.",4:"Cacao (Côte d’Ivoire 1re, environ 39 %, puis Ghana), café, or, diamants, cobalt (RDC), platine (Afrique du Sud), pétrole (Nigeria, Angola, Algérie), phosphates (Maroc)."};
FIX.g42={1:"Pretoria est la capitale (siège de l’exécutif) ; Le Cap abrite le Parlement et Bloemfontein la justice ; Johannesburg est la capitale économique.",5:"Le réseau routier (environ 188 000 km) et le réseau ferré (environ 21 600 km) sont les plus actifs d’Afrique ; ports : Durban, Le Cap, East London, Richards Bay, Saldanha ; universités et système de santé développés.",9:"Régime de ségrégation et de discrimination raciales instauré en 1948 (de l’afrikaans « à part »), aboli officiellement en 1991 ; premières élections multiraciales le 27 avril 1994, Nelson Mandela devenant le premier président noir ; prix Nobel de la paix 1993 avec F. W. de Klerk."};
FIX.g43={0:"Abuja est la capitale, au centre du pays ; Lagos, port du golfe de Guinée, est la capitale économique."};
FIX.g48_49={0:"L’OUA est créée le 25 mai 1963 à Addis-Abeba (32 États). L’Union africaine la remplace : lancée à Durban le 8 juillet 2002 (siège à Addis-Abeba ; 55 États membres).",4:"Communauté économique des États de l’Afrique de l’Ouest, créée par le traité de Lagos (1975, en vigueur en 1977) ; siège aujourd’hui à Abuja.",5:"Communauté de développement de l’Afrique australe : créée le 5 avril 1980 (SADCC), devenue SADC en 1992 ; siège à Gaborone ; la RDC en est membre depuis 1997.",7:"Marché commun de l’Afrique orientale et australe, créé au début des années 1990 (traité de 1993, en vigueur en 1994) ; siège à Lusaka."};
FIX.g50_51={4:"Née des Communautés européennes (CECA en 1951, traité de Rome en 1957), l’UE naît du traité de Maastricht (1992). Objectifs : marché unique, monnaie unique (euro depuis 1999), paix et politiques communes."};

EXTRA.g1=["Environ 2 190 km du nord au sud (de 5°20’ N à 13°27’ S) et environ 2 110 km de l’est à l’ouest.","Nord : Sidi (Nord-Ubangi). Sud : Kipilungu (Haut-Katanga). Ouest : Banana (Kongo-Central). Est : Mahagi (Ituri).","Environ 70 % : rivières (Ubangi, Congo, Kwango, Kasaï, Luapula), lacs (Moero, Tanganyika, Édouard, Albert) et montagnes (Rwenzori, Virunga).","Deuxième pays francophone du monde après la France (selon le manuel), et onzième pays du monde par la superficie."];
EXTRA.g2=["Le Karisimbi (4 507 m). Parmi les volcans encore actifs : le Nyiragongo (3 470 m) et le Nyamuragira (3 058 m)."];
EXTRA.g3_4=["Entre 10° et 20° de latitude : 800 à 1 200 mm de pluie, longue saison sèche (6 à 9 mois) et courte saison des pluies ; savane herbeuse et forêt claire (extrémité sud du Kwango, du Kwilu, du Kasaï et du Haut-Katanga).","D’environ 1 °C tous les 180 m (0,65 °C pour 100 m) : d’où le climat tempéré des hautes terres de l’Est.","Il remonte le long de la côte atlantique et y apporte la sécheresse."];
EXTRA.g5=["L’Institut congolais pour la conservation de la nature (ICCN), héritier de l’Institut des parcs nationaux du Congo créé en 1934 ; ses missions : protéger la faune et la flore, favoriser la recherche scientifique et le tourisme.","Virunga : 1925. Garamba : 1938. Upemba : 1939. Kundelungu, Kahuzi-Biega, Maïko et Salonga : 1970."];
EXTRA.g6=["Cours supérieur ou Lualaba (de la source à Kisangani, environ 2 640 km) ; cours moyen (Kisangani–Kinshasa, environ 1 700 km, navigable) ; cours inférieur (Kinshasa–océan, environ 360 km, avec chutes et rapides).","Le bassin du Congo (presque tout le pays, environ 3 684 000 km²), le bassin du Nil (extrême nord-est, par la Semliki) et le bassin du Shiloango (nord-ouest du Kongo-Central).","Quatre groupes : lacs de fossé d’effondrement (Albert, Édouard, Kivu, Tanganyika), lacs de plateaux du Katanga (Moero, Bangwelo, Upemba, Kisale…), lacs de cuvette (Mai-Ndombe, Tumba), lacs de cratère (lac Vert).","Le lac Kivu, à cause de son gaz méthane ; le lac Albert est au contraire le plus poissonneux.","Environ 148 km (bief maritime Matadi–océan)."];
EXTRA.g7=["Environ 46 ‰ (contre 16 ‰ pour la mortalité), avec un indice de fécondité d’environ 6,9 enfants par femme : l’un des plus élevés du monde.","Les Pygmées (Mbuti), peuple nomade de chasseurs-cueilleurs, refoulés par les Bantous.","Le français (langue de l’administration, de l’enseignement et du commerce) ; la RDC est le deuxième pays francophone du monde."];
EXTRA.g8=["Kinshasa et Lubumbashi (selon le manuel) ; les villes congolaises sont de type colonial et jouent des fonctions économique, administrative, commerciale et industrielle.","Plus de la moitié ; cette jeunesse pose des problèmes d’accueil dans les écoles et les hôpitaux et d’emploi."];
EXTRA.g9_10=["Trois pôles tournés vers l’extérieur : l’Ouest (Kinshasa, océan Atlantique), l’Est (océan Indien par Mombasa et Dar es Salaam) et le Sud (Afrique australe, SADC, RSA). Les minerais apportent environ 70 % des devises, selon le manuel."];
EXTRA.g11_12=["L’arabica (haute qualité, hautes terres volcaniques de l’Est) et le robusta (plus résistant, Uélé, Ubangi, Maniema, Kasaï).","Le maïs (d’Afrique du Sud et de Zambie) pour les minoteries et brasseries, le riz (Pakistan, Thaïlande, Ghana), le blé, le poisson, l’huile végétale.","À l’Est et au Sud-Est : élevage extensif de prestige par les pasteurs nilotiques et hamitiques. Ailleurs : élevage pour la viande (races Ndama, Dahomey, Afrikander).","Environ 48 % du territoire, dont la forêt équatoriale de la cuvette centrale (environ 100 millions d’hectares).","Mayumbe, Boma, Nioki (Mai-Ndombe), Mbandaka, Kwilu et Kwango ; sociétés : Agrifor, Finabois, Forescom, Prodaf, Sokinex."];
EXTRA.g13=["Le Sud-Katanga (région cuprifère : cuivre, cobalt, zinc, uranium…), la région stannifère (du nord du Haut-Lomami au Nord-Kivu : étain, coltan, or, tungstène), la région aurifère de Kilo-Moto (Ituri, Haut-Uélé) et la région diamantifère (Tshikapa, Mbuji-Mayi).","En 1906, par l’Union minière du Haut-Katanga ; la Gécamines a repris les activités le 1er janvier 1967.","Au Kivu (Masisi, Walikale, Mwenga, Shabunda) ; il sert notamment dans les téléphones portables.","À Kipushi (Haut-Katanga), où il est associé au cuivre ; on y extrait aussi plomb et argent."];
EXTRA.g14_15=["La SOCIR (Société congolaise des industries de raffinage), à Moanda ; Ango-Ango est le port pétrolier d’où partent les pipelines vers Kinshasa.","Mwadingusha et Koni (sur la Lufira), Nzilo, Nseke et Mukula (sur le Lualaba).","À Shinkolobwe (Haut-Katanga). Le Centre régional d’études nucléaires de Kinshasa (CREN-K) se trouve à l’UNIKIN."];
EXTRA.g16_17=["Environ 13 % de la main-d’œuvre, ce qui montre la faiblesse du secteur.","CILU à Lukala et CINAT à Kimpese (Kongo-Central), Cemenkat à Lubudi (Katanga), Cimenki à Katana (Sud-Kivu), Ciments-Lacs à Kabimba (Kalemie), GCM à Likasi.","Bralima (Bukavu, Boma, Kisangani, Kinshasa…), Bracongo (Kinshasa…), Brasimba (Lubumbashi, Likasi, Kolwezi) ; huileries et savonneries : Marsavco."];
EXTRA.g18=["Les routes de desserte agricole relient les villes aux campagnes ; les routes nationales relient les provinces entre elles et à la capitale (par exemple Matadi–Kinshasa).","Ango-Ango, d’où partent les pipelines vers Kinshasa.","Airtel, Orange, Vodacom et Tigo (ex-Oasis) ; la radio et la télévision nationales sont gérées par la RTNC.","Quatre secteurs : Ouest (Matadi–Kinshasa, Tshela–Boma), Est (Kindu–Kalemie, Kisangani–Ubundu), Sud (Sakania–Ilebo…) et Nord (Bumba–Aketi–Isiro–Mungbere)."];
EXTRA.g19=["Intra-provinciaux : entre villes et campagnes d’une même province. Interprovinciaux (ou extra-provinciaux) : entre plusieurs provinces.","Pièces de rechange, appareils électroménagers, vêtements, cosmétiques, véhicules, appareils électroniques."];

EXTRA.g34=["Elle exploite les plus grands gisements de cuivre, cobalt et zinc, avec trois groupes : Ouest (Kolwezi, environ 80 % des réserves cuprifères), Centre (Likasi) et Sud (Lubumbashi, Kipushi).","Les lignes de la compagnie KDL (Kinshasa–Dilolo–Lubumbashi) et les liaisons vers Beira, Dar es Salaam et le Cap ; l’aéroport international de Luano est à Lubumbashi."];
EXTRA.g40=["Environ 8 000 km, du cap Bon (Tunisie, 37°20’ N) au cap des Aiguilles (Afrique du Sud, 34°40’ S) ; environ 7 500 km d’ouest en est, du cap Vert (Sénégal) au cap Guardafui (Somalie).","Le canal de Suez, creusé à travers l’isthme de Suez et ouvert en 1869.","Un détroit est un bras de mer resserré entre deux terres (Gibraltar) ; un isthme est une bande de terre étroite entre deux mers qui réunit deux continents (Suez)."];

EXTRA.g42=["La rencontre du courant chaud du Mozambique et du courant froid de Benguela favorise la pêche : la RSA est le deuxième pays pêcheur d’Afrique après le Maroc (selon le manuel).","Le charbon, extrait au Transvaal et au Natal ; la RSA détient environ 90 % des réserves africaines de charbon.","L’anglais et l’afrikaans (selon le manuel) ; la monnaie est le rand."];

  function curQ(s){
    if (!s.cur || s.cur.idx !== s.idx) {

    }
    return s.cur;
  }
  function viewQuiz(s, c){
    var q = curQ(s), multi = c.ok.length > 1, p = Math.round(s.known / s.total * 100);

    var nsel = Object.keys(q.sel).length;

      '<p class="hint">' + (multi ? 'Cochez toutes les assertions exactes.' : 'Cochez la bonne assertion.') + '</p>' +
      '<div class="opts" role="' + (multi ? 'group' : 'radiogroup') + '">';
    q.opts.forEach(function(o, i){
      var on = !!q.sel[i], cls = 'opt', tag = '';
      if (q.done) {
        if (o.ok && on) { cls += ' good'; tag = 'Exacte'; }
        else if (o.ok) { cls += ' miss'; tag = 'À cocher'; }

      h += '<button class="' + cls + '" data-a="opt" data-id="' + i + '" role="' + (multi ? 'checkbox' : 'radio') + '" aria-checked="' + on + '"' + (q.done ? ' disabled' : '') + '>' +
        '<span class="box" aria-hidden="true"></span><span class="otxt">' + esc(o.t) + '</span>' + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</button>';
    });
    h += '</div>';
    if (!q.done) {
      h += '<button class="btn full" data-a="validate" style="margin-top:16px"' + (nsel ? '' : ' disabled') + '>Valider</button>' +
        '<button class="link" data-a="idk" style="width:100%;text-align:center">Je ne sais pas</button>';
    } else {
      h += '<div class="fb ' + (q.good ? 'good' : 'bad') + '" role="status">' + (q.good ? 'Bonne réponse' : (nsel ? 'Pas tout à fait' : 'Voici la réponse')) + '</div>' +

        '<button class="btn full" data-a="next" style="margin-top:16px">Suivant</button>';
    }
    return h;
  }
  function viewSteps(s, c, q){

    var h = '<div class="bar" style="--p:' + p + '%"><i></i></div><p class="sub" style="margin:0">' + s.known + ' sur ' + s.total + ' acquises</p>' +
      '<div class="qcard"><span class="side">Question</span><p class="qtxt">' + esc(c.q) + '</p></div>' +

      '<div class="assert' + (answered ? (q.fb ? ' good' : ' bad') : '') + '">' + esc(o.t) + '</div>';
    if (!answered) {
      h += '<div class="answers"><button class="btn ghost" data-a="ans" data-id="0">À écarter</button><button class="btn" data-a="ans" data-id="1">À cocher</button></div>' +

        '<button class="btn full" data-a="nextstep" style="margin-top:16px">' + (j < n - 1 ? 'Assertion suivante' : 'Voir le résultat') + '</button>';
    }
    return h;
  }

        '<div class="pm"><div class="pm-l"><div class="pm-n">WhatsApp</div><div class="pm-v">+243 85 08 00 833</div></div>' +
        '<button class="btn small ghost" data-a="copy" data-id="w">' + (ui.copied === 'w' ? 'Copié' : 'Copier') + '</button></div>' +
        '<a class="btn full" href="' + waLink() + '" target="_blank" rel="noopener" style="margin-top:12px">' + ico('chat', 20) + ' Ouvrir WhatsApp</a>' +
        '<h3>3. Entrez votre code</h3>' +
        '<label for="proCode" style="margin-top:6px">Code d’activation</label>' +
        '<div class="row"><input type="text" id="proCode" maxlength="20" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX" value="' + esc(ui.codeVal || '') + '"><button class="btn" data-a="activate">Activer</button></div>' +
        (ui.msg ? '<p class="' + (ui.msg.ok ? 'fb good' : 'err') + '" role="status">' + esc(ui.msg.s) + '</p>' : '') +
        '<button class="link" data-a="pro" style="margin-top:8px">Retour</button>' +
        '<button class="link" data-a="closeModal" style="width:100%;text-align:center">Fermer</button>';
    }
    return h + '</div></div>';
  }

  function render(){
    data.pro = proActive();
    applyPrefs();
    var y = window.scrollY, prev = ui.last, shEl = document.getElementById('sheet'), shY = shEl ? (shEl.scrollTop || 0) : 0;
    var h;
    switch (ui.view) {
      case 'deck': h = viewDeck(); break;
      case 'lesson': h = viewLesson(); break;
      case 'study': h = viewStudy(); break;
      case 'decks': h = viewDecks(); break;
      case 'progress': h = viewProgress(); break;
      case 'settings': h = viewSettings(); break;
      default: h = viewHome();
    }
    if (prev === 'home' && ui.view !== 'home') ui.homeY = y;
    var hasBar = ui.view !== 'study';
    app.className = 'wrap' + (hasBar ? ' hasbar' : '');
    app.innerHTML = h + (hasBar ? tabbar() : '') + viewModal();
    if (ui.keepSheet) { var sh2 = document.getElementById('sheet'); if (sh2) sh2.scrollTop = shY; ui.keepSheet = false; }
    ui.err = '';
    if (prev !== ui.view) window.scrollTo(0, ui.view === 'home' ? ui.homeY : 0);
    else if (ui.top) { window.scrollTo(0, 0); }
    else { window.scrollTo(0, y); }
    ui.top = false;
    ui.last = ui.view;
    if (ui.focus) {
      var el = document.querySelector(ui.focus);
      if (el) el.focus();
      ui.focus = null;
    }
  }

  /* ================== SESSIONS DE RÉVISION ================== */
  function order(items){
    var u = [], k = [];
    items.forEach(function(i){ (data.prog[i.k] ? k : u).push(i); });
    return shuffle(u).concat(shuffle(k));
  }
  function begin(title, queue, back, src){
    if (!queue.length) return;
    ui.study = { title:title, queue:queue, idx:0, known:0, again:0, total:queue.length, back:back, src:src };
    ui.view = 'study';
    render();
  }
  function startLesson(id){
    var rec = LESSONS[id];
    if (!rec || !unlocked(rec.chap)) { ui.modal = 'pro'; render(); return; }
    begin(label(rec.l), order(lessonItems(rec.l)), { view: ui.view === 'lesson' ? 'lesson' : 'home', lessonId:id }, { type:'lesson', id:id });
  }
  function startDeck(id){
    var d = deckById(id);
    if (!d) return;
    var items = d.cards.map(function(c){ return { k:'u:' + c.id, q:c.q, a:c.a }; });
    begin(d.name, order(items), { view:'deck', deckId:id }, { type:'deck', id:id });
  }
  function startMix(){
    var items = [];
    Object.keys(LESSONS).forEach(function(id){
      var rec = LESSONS[id];
      if (unlocked(rec.chap)) items = items.concat(lessonItems(rec.l));
    });
    begin('Révision mixte', order(items).slice(0, MIX_SIZE), { view:'home' }, { type:'mix' });
  }

  /* ================== ACTIONS ================== */
  var actions = {
    home: function(){ ui.view = 'home'; ui.confirmDel = null; render(); },
    lesson: function(id){ ui.view = 'lesson'; ui.lessonId = id; render(); },
    lock: function(){ ui.modal = 'pro'; render(); },
    studyLesson: function(id){ startLesson(id); },
    mix: function(){ startMix(); },
    resetLesson: function(id){
      var l = LESSONS[id].l;
      l.c.forEach(function(c, i){ delete data.prog[l.id + ':' + i]; });
      save(); render();
    },
    open: function(id){ ui.view = 'deck'; ui.deckId = id; ui.confirmDel = null; render(); },
    createDeck: function(){
      var input = document.getElementById('newDeck'), name = input.value.trim();
      if (!name) { ui.err = 'Saisissez un nom pour le paquet.'; ui.focus = '#newDeck'; render(); return; }
      if (!data.pro && data.decks.length >= FREE_DECKS) { ui.modal = 'pro'; render(); return; }
      data.decks.push({ id:uid(), name:name, cards:[] });
      save(); render();
    },
    addCard: function(){
      var d = deckById(ui.deckId);
      var q = document.getElementById('cq').value.trim(), a = document.getElementById('ca').value.trim();
      if (!q || !a) { ui.err = 'Remplissez la question et la réponse.'; ui.focus = q ? '#ca' : '#cq'; render(); return; }
      if (!data.pro && d.cards.length >= FREE_CARDS) { ui.modal = 'pro'; render(); return; }
      d.cards.push({ id:uid(), q:q, a:a });
      save(); ui.focus = '#cq'; render();
    },
    delCard: function(id){
      var d = deckById(ui.deckId);
      d.cards = d.cards.filter(function(c){ return c.id !== id; });
      delete data.prog['u:' + id];
      save(); render();
    },
    delDeck: function(){
      if (ui.confirmDel === ui.deckId) {
        data.decks = data.decks.filter(function(d){ return d.id !== ui.deckId; });
        save(); ui.view = 'decks'; ui.confirmDel = null; render();
      } else { ui.confirmDel = ui.deckId; render(); }
    },
    study: function(id){ startDeck(id); },
    restart: function(){
      var src = ui.study.src;
      if (src.type === 'lesson') startLesson(src.id);
      else if (src.type === 'deck') startDeck(src.id);
      else startMix();
    },
    quit: function(){
      var b = ui.study ? ui.study.back : { view:'home' };
      ui.study = null;
      ui.view = b.view;
      if (b.lessonId) ui.lessonId = b.lessonId;
      if (b.deckId) ui.deckId = b.deckId;
      render();
    },
    flip: function(){
      var s = ui.study, btn = document.querySelector('.flip');
      s.flipped = !s.flipped;
      btn.classList.toggle('is-flipped', s.flipped);
      btn.setAttribute('aria-pressed', String(s.flipped));
      btn.querySelector('.front').setAttribute('aria-hidden', String(s.flipped));
      btn.querySelector('.back').setAttribute('aria-hidden', String(!s.flipped));
      document.getElementById('answers').hidden = !s.flipped;
      document.getElementById('hint').hidden = s.flipped;
    },
    known: function(){
      var s = ui.study, c = s.queue[s.idx];
      data.prog[c.k] = 1; save();
      s.known++; s.idx++; s.flipped = false; render();
    },
    again: function(){
      var s = ui.study, c = s.queue[s.idx];
      delete data.prog[c.k]; save();
      s.again++; s.queue.push(c); s.idx++; s.flipped = false; render();
    },
    opt: function(id){
      var s = ui.study, q = curQ(s), c = s.queue[s.idx];
      if (q.done) return;
      if (c.ok.length > 1) { if (q.sel[id]) delete q.sel[id]; else q.sel[id] = true; }
      else { q.sel = {}; q.sel[id] = true; }
      render();
    },
    validate: function(){
      var s = ui.study, q = curQ(s), c = s.queue[s.idx];
      if (q.done || !Object.keys(q.sel).length) return;
      q.good = q.opts.every(function(o, i){ return o.ok === !!q.sel[i]; });
      finishQ(s, q, c);
    },
    idk: function(){
      var s = ui.study, q = curQ(s), c = s.queue[s.idx];
      if (q.done) return;
      q.sel = {}; q.good = false;
      finishQ(s, q, c);
    },
    next: function(){ ui.study.idx++; ui.top = true; render(); },
    tab: function(id){ ui.view = id; ui.confirmDel = null; ui.confirmReset = false; render(); },
    theme: function(id){ data.theme = id; save(); render(); },
    fs: function(id){ data.fs = +id; save(); render(); },
    resetAll: function(){
      if (ui.confirmReset) { data.prog = {}; save(); ui.confirmReset = false; }
      else { ui.confirmReset = true; }
      render();
    },
    install: function(){
      var d = deferredPrompt;
      if (!d) return;
      d.prompt();
      if (d.userChoice && d.userChoice.then) d.userChoice.then(function(){ deferredPrompt = null; render(); });
    },
    pro: function(){ ui.modal = 'pro'; ui.msg = null; render(); },
    pay: function(){ ui.modal = 'pay'; ui.msg = null; render(); },
    copy: function(id){
      var m = id === 'w' ? { v:'+243850800833' } : PAY[+id], key = id === 'w' ? 'w' : +id;
      copyText(m.v, function(ok){
        ui.copied = ok ? key : null; ui.keepSheet = true;
        ui.msg = ok ? null : { ok:false, s:'Copie impossible : maintenez le doigt sur le texte pour le sélectionner.' };
        render();
        if (ok) setTimeout(function(){ ui.copied = null; ui.keepSheet = true; if (ui.modal === 'pay') render(); }, 2000);
      });
    },
    activate: function(){
      var inp = document.getElementById('proCode'), val = inp ? inp.value : '';
      ui.codeVal = val;
      var err = activate(val);
      ui.keepSheet = true;
      if (err) { ui.msg = { ok:false, s:err }; }
      else { ui.msg = { ok:true, s:planLine() }; ui.codeVal = ''; }
      render();
    },
    ans: function(id){
      var s = ui.study, q = curQ(s);
      if (q.done || q.fb !== null) return;
      q.ans[q.j] = (id === '1');
      q.fb = (q.ans[q.j] === q.opts[q.j].ok);
      render();
    },
    nextstep: function(){
      var s = ui.study, q = curQ(s), c = s.queue[s.idx];
      if (q.j < q.opts.length - 1) { q.j++; q.fb = null; render(); return; }
      q.sel = {};
      q.opts.forEach(function(o, i){ if (q.ans[i]) q.sel[i] = true; });
      q.good = q.opts.every(function(o, i){ return o.ok === !!q.ans[i]; });
      finishQ(s, q, c);
    },
    closeModal: function(){ ui.modal = null; ui.msg = null; render(); }
  };

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-a]');
    if (!t) return;
    if (t.classList.contains('overlay') && e.target !== t) return;
    var fn = actions[t.dataset.a];
    if (fn) fn(t.dataset.id);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && ui.modal) { ui.modal = null; render(); }
  });

  render();
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt = e; render(); });
  window.addEventListener('appinstalled', function(){ deferredPrompt = null; render(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function(){ try { navigator.serviceWorker.register('sw.js').catch(function(){}); } catch (e) {} });
  }
})();
</script>
</body>
</html>
